<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" aria-hidden="true">
  <!-- 完成落章「手搓·测过」：任务成功时盖下 -->
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6"/>
    </filter>
  </defs>
  <g transform="rotate(-6 70 70)" filter="url(#rough)">
    <rect x="8" y="8" width="124" height="124" rx="14" fill="none" stroke="#b3392f" stroke-width="7"/>
    <text x="43" y="60" text-anchor="middle" font-family="'Kaiti SC','STKaiti',KaiTi,serif" font-size="40" font-weight="700" fill="#b3392f">手</text>
    <text x="97" y="60" text-anchor="middle" font-family="'Kaiti SC','STKaiti',KaiTi,serif" font-size="40" font-weight="700" fill="#b3392f">搓</text>
    <text x="43" y="116" text-anchor="middle" font-family="'Kaiti SC','STKaiti',KaiTi,serif" font-size="40" font-weight="700" fill="#b3392f">测</text>
    <text x="97" y="116" text-anchor="middle" font-family="'Kaiti SC','STKaiti',KaiTi,serif" font-size="40" font-weight="700" fill="#b3392f">过</text>
  </g>
</svg>
