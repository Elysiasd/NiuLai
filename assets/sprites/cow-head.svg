<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <!-- 低模牛头正脸（v3 电影配色）：硬边三角面平涂，明亮橙 + 米黄嘴鼻。
       配色取自《牛来》真实电影截图——主角橙色 #FF9966 系、米黄嘴鼻 #FFE4C4，
       简化到 6 个硬边平涂三角形，模拟 PS1 低质 3D 质感。
       用于右侧探头水印与 hero 图标位，透明底以便叠任意背景。 -->
  <!-- 耳（简化横出三角形） -->
  <polygon points="2,22 12,18 12,30" fill="#e8823d"/>
  <polygon points="62,22 52,18 52,30" fill="#d4772f"/>
  <!-- 脸部主体：明亮橙色 6 面体（额头 + 左右脸颊各 2 面 + 中心鼻梁区） -->
  <polygon points="12,18 32,12 52,18 32,32" fill="#ffa04d"/>
  <polygon points="12,18 32,32 18,48" fill="#ff9966"/>
  <polygon points="52,18 32,32 46,48" fill="#ff8c52"/>
  <polygon points="18,48 32,32 32,56" fill="#ffa560"/>
  <polygon points="46,48 32,32 32,56" fill="#f59550"/>
  <!-- 米黄大口鼻：硬边梯形平涂 -->
  <polygon points="20,46 44,46 38,60 26,60" fill="#ffe4c4"/>
  <!-- 眼睛简化为小黑点（不对称） -->
  <circle cx="22" cy="32" r="2.8" fill="#2a1a10"/>
  <circle cx="42" cy="32" r="2.2" fill="#2a1a10"/>
  <!-- 鼻孔：暗褐色 -->
  <ellipse cx="28" cy="52" rx="1.8" ry="2.2" fill="#6b4d3e"/>
  <ellipse cx="36" cy="52" rx="1.8" ry="2.2" fill="#6b4d3e"/>
</svg>
