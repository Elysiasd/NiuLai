<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" aria-hidden="true">
  <!-- 前排观众剪影条：完成时刻从底部浮现。六种姿态循环：
       正坐 / 歪头 / 后仰大笑 / 举手机盗摄 / 举荧光棒 / 挨着的小牛。
       全部低模硬边轮廓，纯黑剪影靠外形说话。 -->
  <g fill="#141414">
    <!-- 1 正坐 -->
    <path d="M40 150V96l14-8-6-16 10-22h24l10 22-6 16 14 8v54z"/>
    <!-- 角 -->
    <path d="M52 52l-14-12 4-8 16 10zM108 52l14-12-4-8-16 10z" transform="translate(0 8)"/>
    <!-- 2 歪头 -->
    <g transform="translate(180 0) rotate(9 90 120)">
      <path d="M40 150V98l13-7-5-15 9-21h24l9 21-5 15 13 7v52z"/>
      <path d="M50 58l-13-11 4-7 15 9zM106 58l13-11-4-7-15 9z"/>
    </g>
    <!-- 3 后仰大笑：头向后、下巴朝天 -->
    <g transform="translate(360 6) rotate(-24 90 130)">
      <path d="M42 150V100l14-8-4-14 12-24h22l12 24-4 14 14 8v50z"/>
      <path d="M54 52l-15-10 5-8 15 9zM104 52l15-10-5-8-15 9z"/>
    </g>
    <!-- 4 举手机盗摄：一臂高举发光手机 -->
    <g transform="translate(540 0)">
      <path d="M40 150V98l14-8-6-15 10-21h24l10 21-6 15 14 8v52z"/>
      <path d="M52 56l-14-11 4-8 16 10zM108 56l14-11-4-8-16 10z"/>
      <rect x="112" y="24" width="10" height="52" rx="4" transform="rotate(14 117 50)"/>
      <rect x="106" y="6" width="26" height="40" rx="5" transform="rotate(14 119 26)"/>
    </g>
    <!-- 手机屏幕微光（唯一非黑元素） -->
    <rect x="650" y="12" width="18" height="30" rx="3" fill="#9fe8c8" opacity="0.85" transform="rotate(14 659 27)"/>
    <!-- 5 举荧光棒 -->
    <g transform="translate(760 0)">
      <path d="M40 150V98l14-8-6-15 10-21h24l10 21-6 15 14 8v52z"/>
      <path d="M52 56l-14-11 4-8 16 10zM108 56l14-11-4-8-16 10z"/>
      <rect x="8" y="14" width="9" height="58" rx="4" transform="rotate(-18 12 43)"/>
    </g>
    <rect x="752" y="8" width="12" height="34" rx="5" fill="#ffd23f" opacity="0.9" transform="rotate(-18 758 25)"/>
    <!-- 6 小牛：矮半头，挨着坐 -->
    <g transform="translate(960 26) scale(0.82)">
      <path d="M40 150V100l13-7-5-14 9-20h24l9 20-5 14 13 7v50z"/>
      <path d="M51 60l-12-10 4-7 13 8zM105 60l12-10-4-7-13 8z"/>
    </g>
  </g>
</svg>
