<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" aria-hidden="true">
  <!-- 简化低质 3D 自然场景：模拟《牛来》电影截图里的平涂山丘 + 地面背景。
       用 3-5 个梯形/三角形硬边平涂，无渐变，PS1 风格质感。
       配色取自电影截图：深绿 #5C7A4D、亮绿 #8BAA6F、褐色地面 #C4A676、灰蓝天 #B0C4D0。 -->
  <!-- 天空底色（可选，铺平整个 viewBox） -->
  <rect width="800" height="240" fill="#B0C4D0"/>

  <!-- 远山 1：深绿梯形 -->
  <polygon points="0,140 180,100 320,110 400,95 0,95" fill="#5C7A4D"/>

  <!-- 远山 2：亮绿三角形 -->
  <polygon points="280,130 480,90 680,125 800,115 800,240 280,240" fill="#8BAA6F"/>

  <!-- 中景山丘：深绿 -->
  <polygon points="400,155 600,135 800,160 800,240 400,240" fill="#5C7A4D"/>

  <!-- 地面：黄褐色平台（前景） -->
  <polygon points="0,180 200,170 400,175 600,168 800,182 800,240 0,240" fill="#C4A676"/>

  <!-- 近景小丘：深褐色（最前） -->
  <polygon points="0,200 120,195 240,202 0,240" fill="#9B7A4A"/>
  <polygon points="560,205 720,198 800,210 800,240 560,240" fill="#9B7A4A"/>
</svg>
